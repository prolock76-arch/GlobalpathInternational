<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Sponsors — GlobalPath International</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --primary: #0B3D91;
  --primary-dark: #062a66;
  --primary-light: #1a5bc4;
  --primary-soft: #eef4ff;
  --accent: #F5A623;
  --accent-dark: #d98c0f;
  --accent-soft: #fff5e1;
  --bg: #F7F9FC;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e5e9f0;
  --success: #0f8a4d;
  --success-bg: #e7f6ee;
  --danger: #c0392b;
  --danger-bg: #fdeceb;
  --telegram: #229ED9;
  --telegram-dark: #1a7ab0;
  --font-body: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-display: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Monaco', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.02em; }
a { color: var(--primary); text-decoration: none; }

/* ---------- HEADER ---------- */
.site-header {
  background: rgba(255,255,255,0.95);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-wrap {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  gap: 14px;
}
.logo {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.1rem;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: -0.03em;
}
.logo-mark {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px;
  box-shadow: 0 4px 14px rgba(11,61,145,0.28);
}
.logo-mark svg { display: block; width: 100%; height: 100%; }
.logo-text { display: flex; flex-direction: column; line-height: 1.05; }
.logo-text small {
  font-family: var(--font-body);
  font-size: 0.55rem;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-top: 2px;
}

/* ---------- MAIN ---------- */
.unlock-main {
  flex: 1;
  max-width: 780px;
  width: 100%;
  margin: 0 auto;
  padding: 28px 20px 90px;
}

/* Loading state */
.loading-wrap {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.loading-wrap .spinner-lg {
  display: inline-block;
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Error state */
.error-wrap {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 28px;
  text-align: center;
  box-shadow: 0 8px 24px rgba(11,61,145,0.06);
}
.error-wrap .err-icon { font-size: 3rem; margin-bottom: 14px; }
.error-wrap h2 { color: var(--primary); font-size: 1.4rem; margin-bottom: 10px; }
.error-wrap p { color: var(--muted); margin-bottom: 20px; }
.error-wrap .err-cta {
  display: inline-block;
  background: var(--primary);
  color: #fff;
  padding: 13px 24px;
  border-radius: 12px;
  font-weight: 700;
  transition: background 0.2s;
}
.error-wrap .err-cta:hover { background: var(--primary-dark); color: #fff; }

/* Hero */
.unlock-hero {
  background: linear-gradient(135deg, #0B3D91 0%, #1a5bc4 100%);
  border-radius: 24px;
  padding: 30px 26px 26px;
  color: #fff;
  text-align: center;
  box-shadow: 0 20px 50px rgba(11,61,145,0.25);
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  animation: heroIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes heroIn {
  from { opacity: 0; transform: translateY(14px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.unlock-hero::before {
  content: '';
  position: absolute;
  top: -50%; right: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 60%);
  pointer-events: none;
}
.unlock-hero > * { position: relative; z-index: 1; }

.unlock-hero .hero-emoji {
  font-size: 2.4rem;
  margin-bottom: 8px;
  display: block;
  animation: floatEmoji 3s ease-in-out infinite;
}
@keyframes floatEmoji {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-4px); }
}
.unlock-hero h1 {
  font-size: 1.7rem;
  font-weight: 900;
  margin-bottom: 8px;
  letter-spacing: -0.03em;
}
.unlock-hero .hero-sub {
  font-size: 0.95rem;
  opacity: 0.92;
  line-height: 1.5;
  max-width: 480px;
  margin: 0 auto;
}
.unlock-hero .ref-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.3);
  padding: 6px 14px;
  border-radius: 20px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  margin-top: 14px;
}

/* Preview card */
.preview-card {
  background: #fff;
  border-radius: 20px;
  border: 1px solid var(--border);
  padding: 24px 22px;
  box-shadow: 0 8px 24px rgba(11,61,145,0.06);
  margin-bottom: 16px;
  animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  animation-delay: 0.1s;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.preview-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.preview-head .ph-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--accent-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
}
.preview-head h2 {
  font-size: 1.15rem;
  color: var(--primary);
  font-weight: 800;
  line-height: 1.3;
}
.preview-head p {
  font-size: 0.85rem;
  color: var(--muted);
  margin-top: 2px;
}

.sponsor-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.sponsor-item:last-child { border-bottom: none; padding-bottom: 4px; }
.sponsor-item .sp-flag {
  font-size: 1.6rem;
  line-height: 1;
  flex-shrink: 0;
  margin-top: 2px;
}
.sponsor-item .sp-body { flex: 1; min-width: 0; }
.sponsor-item .sp-name {
  font-weight: 800;
  color: var(--primary);
  font-size: 1rem;
  line-height: 1.3;
  margin-bottom: 2px;
}
.sponsor-item .sp-meta {
  font-size: 0.83rem;
  color: var(--muted);
  font-weight: 600;
}

/* Locked teaser */
.locked-teaser {
  margin-top: 18px;
  background: linear-gradient(135deg, #f8fafc 0%, #eef4ff 100%);
  border: 2px dashed #c7d6f0;
  border-radius: 16px;
  padding: 20px 18px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.locked-teaser .lt-lock {
  font-size: 1.6rem;
  margin-bottom: 8px;
  display: inline-block;
  animation: wiggle 2.4s ease-in-out infinite;
}
@keyframes wiggle {
  0%, 100% { transform: rotate(0deg); }
  25%      { transform: rotate(-6deg); }
  75%      { transform: rotate(6deg); }
}
.locked-teaser h3 {
  font-size: 0.98rem;
  color: var(--primary);
  font-weight: 800;
  margin-bottom: 6px;
}
.locked-teaser p {
  font-size: 0.85rem;
  color: var(--muted);
  line-height: 1.5;
  max-width: 420px;
  margin: 0 auto;
}
.locked-teaser .blur-line {
  height: 10px;
  border-radius: 5px;
  background: linear-gradient(90deg, #c7d6f0 0%, #e0e9f8 50%, #c7d6f0 100%);
  margin: 10px auto 0;
  max-width: 320px;
  filter: blur(2px);
  opacity: 0.7;
}

/* "See what's inside" button */
.see-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  background: #fff;
  border: 2px solid var(--primary);
  color: var(--primary);
  padding: 14px 22px;
  border-radius: 14px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 16px;
}
.see-btn:hover {
  background: var(--primary-soft);
  transform: translateY(-1px);
}
.see-btn .arrow {
  transition: transform 0.25s;
}
.see-btn.open .arrow { transform: rotate(180deg); }

/* Revealed section */
.revealed {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.45s ease-out, opacity 0.3s;
  opacity: 0;
}
.revealed.open {
  max-height: 1600px;
  opacity: 1;
  margin-top: 16px;
}
.revealed-inner {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 18px;
}
.revealed-inner h3 {
  font-size: 1rem;
  color: var(--primary);
  font-weight: 800;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.how-step {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.how-step:last-child { border-bottom: none; }
.how-step .hs-num {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.78rem;
  font-weight: 800;
  flex-shrink: 0;
  margin-top: 2px;
}
.how-step .hs-body {
  flex: 1;
  font-size: 0.88rem;
  color: #334155;
  line-height: 1.55;
}
.how-step .hs-body strong {
  color: var(--primary);
}

/* Explanation block */
.explain-block {
  background: linear-gradient(135deg, #fff8e8 0%, #fff 60%, #fff5e1 100%);
  border: 2px solid var(--accent);
  border-radius: 20px;
  padding: 24px 22px;
  margin-bottom: 16px;
  box-shadow: 0 12px 30px rgba(245,166,35,0.15);
  animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  animation-delay: 0.2s;
}
.explain-block h2 {
  font-size: 1.15rem;
  color: var(--primary);
  font-weight: 900;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.explain-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.explain-list li {
  display: flex;
  gap: 10px;
  font-size: 0.9rem;
  color: #334155;
  line-height: 1.5;
}
.explain-list .el-icon {
  font-size: 1.05rem;
  flex-shrink: 0;
  margin-top: 1px;
}

/* CTA block */
.cta-block {
  background: #fff;
  border-radius: 20px;
  border: 1px solid var(--border);
  padding: 24px 22px;
  box-shadow: 0 12px 30px rgba(11,61,145,0.08);
  text-align: center;
  animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  animation-delay: 0.3s;
}
.cta-price {
  font-family: var(--font-display);
  font-size: 2.4rem;
  font-weight: 900;
  color: var(--primary);
  letter-spacing: -0.03em;
  line-height: 1;
  margin-bottom: 4px;
}
.cta-price small {
  font-size: 0.9rem;
  color: var(--muted);
  font-weight: 600;
  display: block;
  margin-top: 4px;
}
.pay-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  background: linear-gradient(135deg, #F5A623 0%, #d98c0f 100%);
  color: #1a1a1a;
  text-decoration: none;
  padding: 18px 26px;
  border-radius: 14px;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 1.1rem;
  border: none;
  cursor: pointer;
  box-shadow: 0 12px 28px rgba(245,166,35,0.45);
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  margin-top: 18px;
  position: relative;
  overflow: hidden;
  animation: floatBtn 2.6s ease-in-out infinite;
}
@keyframes floatBtn {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}
.pay-btn::after {
  content: '';
  position: absolute;
  top: 0; left: -60%;
  width: 50%; height: 100%;
  background: linear-gradient(120deg, transparent 0%, rgba(255,255,255,0.6) 50%, transparent 100%);
  transform: skewX(-20deg);
  animation: shine 2.8s ease-in-out infinite;
}
@keyframes shine {
  0%   { left: -60%; }
  60%  { left: 130%; }
  100% { left: 130%; }
}
.pay-btn:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 16px 36px rgba(245,166,35,0.55);
}
.pay-btn:disabled {
  opacity: 0.7;
  cursor: wait;
  animation: none;
}

.trust-row {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 0.78rem;
  color: var(--muted);
  font-weight: 700;
  margin-top: 16px;
}

.urgency-line {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed rgba(245,166,35,0.5);
  font-size: 0.8rem;
  color: #8a5a00;
  font-weight: 700;
}

/* Unlocked state */
.unlocked-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--success-bg);
  color: var(--success);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.unlocked-card {
  background: #fff;
  border-radius: 20px;
  border: 2px solid var(--success);
  padding: 24px 22px;
  box-shadow: 0 12px 30px rgba(15,138,77,0.12);
  margin-bottom: 16px;
}
.unlocked-card h2 {
  font-size: 1.2rem;
  color: var(--success);
  font-weight: 900;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sponsor-full {
  background: var(--bg);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
  border-left: 4px solid var(--accent);
}
.sponsor-full .sf-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.sponsor-full .sf-flag { font-size: 1.4rem; }
.sponsor-full .sf-name {
  font-weight: 800;
  color: var(--primary);
  font-size: 1rem;
}
.sponsor-full .sf-role {
  font-size: 0.82rem;
  color: var(--muted);
  font-weight: 600;
}
.sponsor-full .sf-desc {
  font-size: 0.87rem;
  color: #334155;
  line-height: 1.55;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}

.next-steps {
  background: var(--primary-soft);
  border-radius: 14px;
  padding: 18px;
  margin-top: 16px;
}
.next-steps h3 {
  font-size: 0.98rem;
  color: var(--primary);
  font-weight: 800;
  margin-bottom: 12px;
}

/* Support block */
.support-block {
  background: linear-gradient(135deg, var(--telegram) 0%, var(--telegram-dark) 100%);
  border-radius: 20px;
  padding: 22px 22px 20px;
  color: #fff;
  margin-top: 16px;
  box-shadow: 0 12px 32px rgba(34,158,217,0.3);
  position: relative;
  overflow: hidden;
}
.support-block::before {
  content: '';
  position: absolute;
  top: -50%; right: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
  pointer-events: none;
}
.support-block > * { position: relative; z-index: 1; }
.support-block h3 { font-size: 1.05rem; margin-bottom: 6px; }
.support-block p { font-size: 0.86rem; opacity: 0.95; margin-bottom: 14px; }
.support-cta {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: #fff;
  color: var(--telegram-dark);
  padding: 14px 22px;
  border-radius: 12px;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.98rem;
  transition: transform 0.2s;
  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}
.support-cta:hover { transform: translateY(-2px); color: var(--telegram-dark); }

/* Responsive */
@media (max-width: 640px) {
  .unlock-main { padding: 20px 16px 100px; }
  .unlock-hero { padding: 26px 20px 22px; }
  .unlock-hero h1 { font-size: 1.4rem; }
  .preview-card, .explain-block, .cta-block, .unlocked-card { padding: 20px 18px; }
  .cta-price { font-size: 2rem; }
  .pay-btn { padding: 16px 22px; font-size: 1rem; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo">

<script>
// ============================================================
// CONFIG

const SUPABASE_URL = 'https://gpciexntoxrmxerboawm.supabase.co';

// ============================================================

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function showError(title, msg) {
  main.innerHTML = `
    <div class="error-wrap">
      <div class="err-icon">⚠️</div>
      <h2>${escapeHtml(title)}</h2>
      <p>${escapeHtml(msg)}</p>
      <a href="track.html" class="err-cta">Go to Tracker</a>
    </div>
  `;
}

function getRef() {
  const params = new URLSearchParams(window.location.search);
  return (params.get('ref') || '').toUpperCase().trim();
}

function isPaidParam() {
  const params = new URLSearchParams(window.location.search);
  return params.get('paid') === '1';
}

// ============================================================
// DATA
// ============================================================
async function fetchApplication(reference) {
  const { data, error } = await supabaseClient
    .from('applications')
    .select('*')
    .ilike('reference', reference)
    .limit(1);
  if (error) throw error;
  return data && data.length ? data[0] : null;
}

async function fetchSponsors(country) {
  let query = supabaseClient.from('sponsors').select('*').eq('active', true).limit(5);
  if (country) query = query.eq('country', country);

  let { data, error } = await query;
  if (error) throw error;

  if (!data || data.length === 0) {
    const fb = await supabaseClient.from('sponsors').select('*').eq('active', true).limit(5);
    if (fb.error) throw fb.error;
    data = fb.data || [];
  }
  return data;
}

window.toggleReveal = function () {
  const btn = document.getElementById('seeBtn');
  const rev = document.getElementById('revealed');
  if (!btn || !rev) return;
  rev.classList.toggle('open');
  btn.classList.toggle('open');
};

// ============================================================
// INIT
// ============================================================
(async function init() {
  console.log('🔍 Unlock page starting...');

  const ref = getRef();
  console.log('📋 Reference from URL:', ref);

  if (!ref) {
    console.warn('⚠️ No reference in URL');
    showError('Missing reference', 'Open this page from the link in your email, or enter your reference on the tracker.');
    return;
  }

  try {
    console.log('📡 Fetching application...');
    const app = await fetchApplication(ref);
    console.log('✅ Application result:', app);

    if (!app) {
      console.warn('⚠️ No application found for ref:', ref);
      showError('Application not found', `We couldn't find an application with the reference "${ref}".`);
      return;
    }

    console.log('📡 Fetching sponsors for country:', app.country);
    const sponsors = await fetchSponsors(app.country);
    console.log('✅ Sponsors result:', sponsors);

    const unlocked = isPaidParam() || app.unlocked === true;
    console.log('🔓 Unlocked?', unlocked);

    if (unlocked) {
      renderUnlocked(app, sponsors);
    } else {
      renderLocked(app, sponsors);
    }
    console.log('✅ Page rendered successfully');
  } catch (err) {
    console.error('❌ Unlock page error:', err);
    showError('Something went wrong', 'Error: ' + (err.message || 'unknown') + ' — contact support via Telegram.');
  }
})();
</script>
