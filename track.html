<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Application — GlobalPath International</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary: #0B3D91;
  --primary-dark: #062a66;
  --primary-light: #1a5bc4;
  --primary-soft: #eef4ff;
  --accent: #F5A623;
  --accent-dark: #d98c0f;
  --accent-soft: #fff5e1;
  --bg: #F7F9FC;
  --text: #0f172a;
  --muted: #64748b;
  --border: #e5e9f0;
  --success: #0f8a4d;
  --success-bg: #e7f6ee;
  --danger: #c0392b;
  --danger-bg: #fdeceb;
  --warn: #b45309;
  --warn-bg: #fff7e6;
  --info: #1e6fd9;
  --info-bg: #e8f1fe;
  --telegram: #229ED9;
  --radius: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --shadow-lg: 0 12px 32px rgba(11,61,145,0.12);
  --font-body: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-display: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Monaco', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.02em; }
a { color: var(--primary); text-decoration: none; }
a:hover { color: var(--primary-dark); }

.site-header {
  background: rgba(255,255,255,0.95);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1000;
}
.nav-wrap {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
  gap: 16px;
  flex-wrap: wrap;
}
.logo {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.2rem;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 11px;
  letter-spacing: -0.03em;
}
.logo-mark {
  width: 42px; height: 42px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px;
  box-shadow: 0 4px 14px rgba(11,61,145,0.28);
  flex-shrink: 0;
}
.logo-mark svg { display: block; width: 100%; height: 100%; }
.logo-text { display: flex; flex-direction: column; line-height: 1.05; }
.logo-text small {
  font-family: var(--font-body);
  font-size: 0.6rem;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-top: 2px;
}
.main-nav { display: flex; align-items: center; gap: 16px; }
.nav-group {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
}
.nav-group a {
  color: var(--text);
  font-weight: 600;
  font-size: 0.9rem;
  padding: 9px 16px;
  border-radius: 8px;
  transition: all 0.18s;
  white-space: nowrap;
}
.nav-group a:hover { background: #fff; color: var(--primary); box-shadow: 0 2px 6px rgba(11,61,145,0.08); }
.nav-group a.active { background: var(--primary); color: #fff; }
.main-nav .nav-help {
  background: linear-gradient(135deg, #229ED9 0%, #1a7ab0 100%);
  color: #fff !important;
  font-weight: 800;
  font-size: 0.94rem;
  padding: 11px 22px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.menu-toggle {
  display: none;
  background: none; border: none;
  font-size: 1.4rem;
  color: var(--primary);
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
}

.hero-track {
  background: linear-gradient(135deg, rgba(11,61,145,0.94), rgba(26,91,196,0.88));
  color: #fff;
  padding: 60px 24px 70px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero-track::before {
  content: '';
  position: absolute; inset: 0;
  background-image: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=1600&q=80');
  background-size: cover;
  background-position: center;
  opacity: 0.3;
  z-index: 0;
}
.hero-track > * { position: relative; z-index: 1; }
.hero-track h1 {
  font-size: clamp(1.7rem, 3.5vw, 2.4rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 12px;
}
.hero-track p { font-size: 1.05rem; max-width: 560px; margin: 0 auto; opacity: 0.95; }

.track-wrap {
  max-width: 820px;
  margin: -30px auto 80px;
  padding: 0 24px;
  position: relative;
  z-index: 2;
}
.track-card {
  background: #fff;
  border-radius: var(--radius-xl);
  padding: 40px 36px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
}
.search-box input {
  flex: 1;
  padding: 16px 18px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 1.05rem;
  font-family: var(--font-mono);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: #fff;
  color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(11,61,145,0.08);
}
.search-box button {
  padding: 16px 32px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 6px 16px rgba(11,61,145,0.25);
  transition: transform 0.2s, background 0.2s;
}
.search-box button:hover { background: var(--primary-dark); transform: translateY(-2px); }
.search-box button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.status-hidden { display: none; }

.status-loading {
  text-align: center;
  padding: 40px 20px;
  color: var(--muted);
}
.status-loading .spinner-lg {
  display: inline-block;
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.status-error {
  background: var(--danger-bg);
  color: var(--danger);
  border-left: 4px solid var(--danger);
  padding: 18px 22px;
  border-radius: var(--radius);
  font-size: 0.95rem;
  font-weight: 600;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.status-error .se-icon { font-size: 1.4rem; flex-shrink: 0; }

.result-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.result-head h2 {
  font-size: 1.4rem;
  color: var(--primary);
  font-weight: 800;
  margin-bottom: 4px;
}
.result-head p { font-size: 0.92rem; color: var(--muted); }
.result-ref {
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 700;
  background: var(--primary-soft);
  color: var(--primary);
  padding: 8px 16px;
  border-radius: 20px;
  letter-spacing: 0.05em;
}

.status-badge {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.status-badge.submitted { background: var(--info-bg); color: var(--info); }
.status-badge.in-progress { background: var(--accent-soft); color: var(--accent-dark); }
.status-badge.approved { background: var(--success-bg); color: var(--success); }
.status-badge.rejected { background: var(--danger-bg); color: var(--danger); }

.timeline {
  position: relative;
  margin: 26px 0;
  padding-left: 32px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 11px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  background: var(--border);
}
.tl-item {
  position: relative;
  padding-bottom: 26px;
}
.tl-item:last-child { padding-bottom: 0; }
.tl-dot {
  position: absolute;
  left: -32px;
  top: 2px;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: 800;
  color: var(--muted);
}
.tl-item.done .tl-dot {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}
.tl-item.active .tl-dot {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 0 0 4px rgba(11,61,145,0.15);
}
.tl-item.pending .tl-dot { background: #fff; border-color: var(--border); }
.tl-item h4 {
  font-size: 0.98rem;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 4px;
}
.tl-item.done h4 { color: var(--success); }
.tl-item.active h4 { color: var(--primary); }
.tl-item p { font-size: 0.88rem; color: var(--muted); line-height: 1.5; }
.tl-item .tl-time { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

.details-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-top: 24px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
}
.detail-item {
  background: var(--bg);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.detail-item .dl-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  font-weight: 700;
  margin-bottom: 4px;
}
.detail-item .dl-value {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text);
  word-break: break-word;
}

.help-box {
  background: linear-gradient(135deg, #e7f6fb 0%, #fff 100%);
  border: 2px solid var(--telegram);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  margin-top: 26px;
  text-align: center;
}
.help-box h3 {
  font-size: 1.05rem;
  color: #0a3d52;
  font-weight: 800;
  margin-bottom: 8px;
}
.help-box p { font-size: 0.9rem; color: #0a3d52; margin-bottom: 16px; line-height: 1.6; }
.help-box a {
  display: inline-block;
  background: var(--telegram);
  color: #fff;
  padding: 12px 24px;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 0.95rem;
  transition: transform 0.2s, background 0.2s;
}
.help-box a:hover { background: #1a7ab0; color: #fff; transform: translateY(-2px); }

@media (max-width: 720px) {
  .search-box { flex-direction: column; }
  .search-box button { width: 100%; }
  .track-card { padding: 28px 22px; }
  .result-head { flex-direction: column; }
  .menu-toggle { display: block; }
  .main-nav {
    display: none;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    order: 3;
    gap: 10px;
    padding: 12px 0;
  }
  .main-nav.open { display: flex; }
  .nav-group { flex-direction: column; }
  .nav-group a { padding: 12px 16px; text-align: center; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 44 44" width="42" height="42" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gpGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1a5bc4"/>
              <stop offset="100%" stop-color="#0B3D91"/>
            </linearGradient>
            <linearGradient id="gpArc" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#F5A623"/>
              <stop offset="100%" stop-color="#d98c0f"/>
            </linearGradient>
          </defs>
          <rect width="44" height="44" rx="12" fill="url(#gpGrad)"/>
          <circle cx="22" cy="22" r="13" stroke="#ffffff" stroke-width="1.6" fill="none" opacity="0.35"/>
          <path d="M 9 22 Q 22 9 35 22" stroke="url(#gpArc)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M 9 22 Q 22 35 35 22" stroke="url(#gpArc)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
          <path d="M 22 9 L 22 35" stroke="#ffffff" stroke-width="1.4" opacity="0.5" stroke-linecap="round"/>
          <circle cx="22" cy="22" r="4" fill="#F5A623"/>
          <circle cx="22" cy="22" r="2" fill="#ffffff"/>
        </svg>
      </span>
      <span class="logo-text">GlobalPath<small>International</small></span>
    </a>
    <button class="menu-toggle" onclick="document.querySelector('.main-nav').classList.toggle('open')">☰</button>
    <nav class="main-nav">
      <div class="nav-group">
        <a href="index.html">Home</a>
        <a href="track.html" class="active">Track</a>
        <a href="portal.html">My Account</a>
        <a href="support.html">Support</a>
      </div>
      <a href="https://t.me/globalpath_support_bot" target="_blank" rel="noopener" class="nav-help">💬 Need Help?</a>
    </nav>
  </div>
</header>

<section class="hero-track">
  <h1>Track Your Application</h1>
  <p>Enter your reference number to see live progress updates.</p>
</section>

<div class="track-wrap">
  <div class="track-card">
    <div class="search-box">
      <input type="text" id="refInput" placeholder="GP-2026-00000" maxlength="14" autocomplete="off" spellcheck="false">
      <button id="trackBtn" onclick="trackApplication()">Track →</button>
    </div>

    <div id="statusLoading" class="status-loading status-hidden">
      <div class="spinner-lg"></div>
      <div>Looking up your application…</div>
    </div>

    <div id="statusError" class="status-error status-hidden">
      <div class="se-icon">⚠️</div>
      <div id="statusErrorText">We couldn't find an application with that reference.</div>
    </div>

    <div id="statusResult" class="status-hidden"></div>
  </div>
</div>

<script>
// ============================================================
// SUPABASE
// ============================================================
const SUPABASE_URL = 'https://gpciexntoxrmxerboawm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dI8etzUXk7kfDvrepR4Inw_jlFLeZ25';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const TELEGRAM_BOT_USERNAME = 'globalpath_support_bot';

// ============================================================
// TRACK
// ============================================================
async function trackApplication() {
  const input = document.getElementById('refInput');
  const btn = document.getElementById('trackBtn');
  const ref = input.value.trim().toUpperCase();

  if (!ref) {
    showError('Please enter your reference number.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Searching…';
  hideAll();
  document.getElementById('statusLoading').classList.remove('status-hidden');

  try {
    const { data, error } = await supabaseClient
      .from('applications')
      .select('*')
      .eq('reference', ref)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      document.getElementById('statusLoading').classList.add('status-hidden');
      showError('We couldn\'t find an application with reference "' + ref + '". Please check the number and try again.');
      return;
    }

    renderResult(data);
  } catch (err) {
    console.error('Track error:', err);
    document.getElementById('statusLoading').classList.add('status-hidden');
    showError('Something went wrong. Please try again in a moment.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Track →';
  }
}

function hideAll() {
  document.getElementById('statusLoading').classList.add('status-hidden');
  document.getElementById('statusError').classList.add('status-hidden');
  document.getElementById('statusResult').classList.add('status-hidden');
}

function showError(msg) {
  hideAll();
  document.getElementById('statusErrorText').textContent = msg;
  document.getElementById('statusError').classList.remove('status-hidden');
}

function renderResult(app) {
  hideAll();
  const el = document.getElementById('statusResult');

  const statusMap = {
    'Submitted':   { cls: 'submitted',   label: 'Submitted' },
    'In Progress': { cls: 'in-progress', label: 'In Progress' },
    'Approved':    { cls: 'approved',    label: 'Approved ✓' },
    'Rejected':    { cls: 'rejected',    label: 'Rejected' }
  };
  const statusInfo = statusMap[app.status] || statusMap['Submitted'];

  // Build timeline
  const statusOrder = ['Submitted', 'In Progress', 'Approved'];
  const currentStatusIdx = statusOrder.indexOf(app.status);
  const timelineSteps = [
    { label: 'Application Received', desc: 'We have your submission. A coordinator is reviewing it.', status: 'done' },
    { label: 'Under Review',         desc: 'Our team is checking your documents and eligibility.',    status: currentStatusIdx >= 1 ? (currentStatusIdx > 1 ? 'done' : 'active') : 'pending' },
    { label: 'Agent Assigned',       desc: 'A verified agent is assigned and will contact you.',      status: currentStatusIdx >= 1 ? (currentStatusIdx > 1 ? 'done' : 'pending') : 'pending' },
    { label: 'Decision',             desc: 'We\'ll notify you by email and Telegram.',               status: currentStatusIdx >= 2 ? 'done' : 'pending' }
  ];

  const created = app.created_at ? new Date(app.created_at).toLocaleString() : '—';

  let html = `
    <div class="result-head">
      <div>
        <h2>Application Status</h2>
        <p>Submitted on ${created}</p>
      </div>
      <div class="result-ref">${escapeHtml(app.reference)}</div>
    </div>

    <div class="status-badge ${statusInfo.cls}">${statusInfo.label}</div>

    <div class="timeline">
      ${timelineSteps.map((t, i) => `
        <div class="tl-item ${t.status}">
          <div class="tl-dot">${t.status === 'done' ? '✓' : (i + 1)}</div>
          <h4>${t.label}</h4>
          <p>${t.desc}</p>
        </div>
      `).join('')}
    </div>

    <div class="details-grid">
      <div class="detail-item">
        <div class="dl-label">Service</div>
        <div class="dl-value">${escapeHtml(app.service_type || '—')}</div>
      </div>
      <div class="detail-item">
        <div class="dl-label">Name</div>
        <div class="dl-value">${escapeHtml(app.full_name || '—')}</div>
      </div>
      <div class="detail-item">
        <div class="dl-label">Email</div>
        <div class="dl-value">${escapeHtml(app.email || '—')}</div>
      </div>
      <div class="detail-item">
        <div class="dl-label">Country</div>
        <div class="dl-value">${escapeHtml(app.country || '—')}</div>
      </div>
      ${app.agent_requested ? `
      <div class="detail-item" style="background:var(--primary-soft);">
        <div class="dl-label">Agent</div>
        <div class="dl-value" style="color:var(--primary);">🛡️ Verified Agent Requested</div>
      </div>
      ` : ''}
    </div>

    <div class="help-box">
      <h3>Need to update something?</h3>
      <p>Message us on Telegram with your reference and we'll help right away.</p>
      <a href="https://t.me/${TELEGRAM_BOT_USERNAME}?start=${encodeURIComponent(app.reference)}" target="_blank" rel="noopener">
        💬 Message Support
      </a>
    </div>
  `;

  el.innerHTML = html;
  el.classList.remove('status-hidden');
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ============================================================
// INIT — read ?ref= from URL
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');
  if (ref) {
    document.getElementById('refInput').value = ref.toUpperCase();
    // auto-track
    setTimeout(() => trackApplication(), 400);
  }

  document.getElementById('refInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') trackApplication();
  });
});
</script>
</body>
</html>
